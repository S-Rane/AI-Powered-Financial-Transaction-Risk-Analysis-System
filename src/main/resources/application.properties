spring.application.name=chatclient
server.port=8025

# 1. Provide your AI API key --- (used only if you are using any model from cloud)
#spring.ai.google.genai.api-key=${API_KEY}
#spring.ai.ollama.api-key=${API_KEY}

#Base url
spring.ai.ollama.base-url=http://localhost:11434

# 2. Specify the chat model targeted 
#spring.ai.google.genai.chat.model=gemini-3-flash-preview
spring.ai.ollama.chat.model=llama3.2

# Embedding model for RAG
spring.ai.ollama.embedding.model=nomic-embed-text

# Force the model to respond exclusively in raw JSON format
spring.ai.ollama.chat.options.response-format.type=json_object

# Optional: Tighten limits to cut down computation time
spring.ai.ollama.chat.temperature=0.0
spring.ai.ollama.chat.top-p=0.1

# 4. Disable embeddings since you're using a Chat endpoint
spring.ai.ollama.chat.enabled=true

################### DB PROPERTIES #########################

# H2 database
spring.datasource.url=jdbc:h2:mem:transactionsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB-USERNAME}
spring.datasource.password=${DB-PWD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console for local development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

################### KAFA PROPERTIES ########################
# Active Kafka broker
spring.kafka.bootstrap-servers=localhost:9092


# Producer configuration
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Consumer configuration
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=transaction-ai-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.spring.ai.chatclient.events.TransactionEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.spring.ai.chatclient.events







